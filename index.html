<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere | Live Weather Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #f8fafc;
        }
        .weather-card {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .temp-display {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <div class="container" style="max-width: 540px;">
        
        <header class="text-center mb-4">
            <h1 class="h3 fw-bold text-white mb-1">
                <i class="bi bi-cloud-sun-fill text-warning me-2"></i>Atmosphere
            </h1>
            <p class="text-secondary small mb-0">Live Hyperlocal Weather Station</p>
        </header>

        <div class="card weather-card shadow-lg rounded-4 p-4">

            <!--search bar-->
            <form id="citySearchForm" class="input-group input-group-sm mb-3">
                <input type="text" class="form-control bg-dark text-white border-secondary" id="citySearchInput" placeholder="Search another city (e.g., Nairobi, Tokyo, London)..." required>
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>

            <!-- Location & Action Row -->
            <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                    <h2 class="h5 fw-bold text-white mb-0" id="cityName">Detecting location...</h2>
                    <span class="small text-secondary" id="coordsDisplay">Coordinates: Pending</span>
                </div>
                <button class="btn btn-outline-info btn-sm d-flex align-items-center gap-1" id="locateBtn">
                    <i class="bi bi-geo-alt-fill"></i>
                    <span>My Location</span>
                </button>
            </div>

            <!-- Status / Alert Banner -->
            <div id="statusAlert" class="alert alert-secondary py-2 small d-none" role="alert">
                <i class="bi bi-info-circle-fill me-1"></i>
                <span id="statusMessage">Checking permissions...</span>
            </div>

            <hr class="border-secondary opacity-25 my-3">

            <!-- Primary Metric Display -->
            <div class="text-center my-3">
                <div class="temp-display text-white mb-2" id="tempValue">--°C</div>
                <div class="fs-5 text-info fw-semibold mb-1" id="weatherCondition">Awaiting data...</div>
                <div class="small text-secondary" id="lastUpdated">Updated: Just now</div>
            </div>

            <!-- Next div add from here-->
            <div class="row g-2 mt-3 text-center">
                <div class="col-4">
                    <div class="p-2 rounded-3 bg-dark bg-opacity-50 border border-secondary border-opacity-25">
                        <i class="bi bi-wind text-info mb-1 d-block fs-5"></i>
                        <span class="small text-secondary d-block">Wind</span>
                        <strong class="text-white" id="windSpeed">-- km/h</strong>
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-2 rounded-3 bg-dark bg-opacity-50 border border-secondary border-opacity-25">
                        <i class="bi bi-droplet-half text-primary mb-1 d-block fs-5"></i>
                        <span class="small text-secondary d-block">Humidity</span>
                        <strong class="text-white" id="humidity">--%</strong>
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-2 rounded-3 bg-dark bg-opacity-50 border border-secondary border-opacity-25">
                        <i class="bi bi-compass text-warning mb-1 d-block fs-5"></i>
                        <span class="small text-secondary d-block">Direction</span>
                        <strong class="text-white" id="windDirection">--°</strong>
                    </div>
                </div>
            </div>

        </div>

        <footer class="text-center mt-4 text-secondary small">
            Powered by Open-Meteo & Nominatim &bull; No API Keys Required
        </footer>

    </div>

    <script src="app.js"></script>
</body>
</html>
